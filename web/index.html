<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cipher-chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body>
  <header id="top">
    <h1>cipher-chat</h1>
    <div id="top-right">
      <span id="conn" class="conn off">connecting...</span>
      <span>logged in as <b id="me-name">...</b></span>
      <button id="my-profile" type="button">My profile</button>
      <button id="logout" type="button">Log out</button>
    </div>
  </header>

  <div id="app">
    <aside id="buddies">
      <h2>Buddy List</h2>
      <form id="add-user-form" autocomplete="off">
        <input id="add-username" type="text" maxlength="20" placeholder="add by username..." aria-label="add by username">
        <button type="submit">Find</button>
      </form>
      <p id="add-user-error" hidden></p>
      <input id="search" type="text" placeholder="filter buddies..." autocomplete="off">
      <ul id="buddy-list"></ul>
      <p id="buddy-empty" hidden>nobody here yet. invite a friend to sign up!</p>
      <p id="my-key" title="your public key fingerprint"></p>
    </aside>

    <section id="chat">
      <div id="chat-empty">
        <p>pick a buddy on the left to start chatting.</p>
        <p class="small">messages are encrypted in your browser before they leave it.</p>
      </div>

      <div id="chat-pane" hidden>
        <div id="chat-head">
          <button id="back" type="button" aria-label="back to buddy list">&laquo;</button>
          <div>
            <div id="chat-name"></div>
            <div id="chat-status"></div>
          </div>
          <button id="view-profile" type="button">Profile</button>
          <button id="verify" type="button">Verify keys</button>
          <button id="block" type="button">Block</button>
        </div>

        <div id="key-warning" hidden>
          <span id="key-warning-text"></span>
          <button id="trust" type="button">I verified it, trust new key</button>
        </div>
        <div id="block-banner" hidden>
          <span id="block-banner-text"></span>
          <button id="unblock" type="button">Unblock</button>
        </div>
        <div id="verify-box" hidden></div>

        <div id="log">
          <button id="older" type="button" hidden>load older messages</button>
          <div id="messages"></div>
        </div>
        <div id="typing" hidden><span></span><span></span><span></span> <em id="typing-name"></em></div>

        <form id="composer" autocomplete="off">
          <textarea id="msg" rows="1" maxlength="4000" placeholder="type a message (Enter to send, Shift+Enter for a new line)"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </div>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <!-- profile page, filled in by profile.js -->
  <div id="profile-overlay" hidden>
    <div id="profile-card" class="theme-classic" role="dialog" aria-modal="true" aria-labelledby="pf-title">
      <div id="pf-bar">
        <span id="pf-title">Profile</span>
        <button id="pf-close" type="button" aria-label="close profile">&times;</button>
      </div>
      <div id="pf-body"></div>
    </div>
  </div>

  <script src="crypto.js"></script>
  <script src="app.js"></script>
  <script src="profile.js"></script>
  <script src="friends.js"></script>
</body>
</html>
