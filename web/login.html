<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="cipher-chat: end-to-end encrypted chat with profiles, friends and group chats.">
  <meta name="theme-color" content="#17407f">
  <title>cipher-chat - a place for friends</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2317407f'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23ff9933'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <noscript><p>cipher-chat needs JavaScript to encrypt your messages in your browser. Turn it on and reload the page.</p></noscript>
  <div id="top">
    <h1>cipher-chat</h1>
    <p>a place for friends. your messages are end-to-end encrypted.</p>
  </div>
  <p id="error" role="alert"></p>
  <div id="wrap">
    <div class="box">
      <h2>Member Login</h2>
      <form id="login-form">
        <label for="login-user">Username:</label>
        <input id="login-user" name="username" type="text" autocomplete="username" autofocus maxlength="20">
        <label for="login-pass">Password:</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" maxlength="128">
        <button type="submit">Login</button>
      </form>
    </div>
    <div class="box">
      <h2>New here? Sign Up!</h2>
      <form id="signup-form">
        <label for="signup-user">Pick a username:</label>
        <input id="signup-user" name="username" type="text" autocomplete="username" maxlength="20">
        <label for="signup-pass">Pick a password:</label>
        <input id="signup-pass" name="password" type="password" autocomplete="new-password" maxlength="128">
        <p class="hint">username: 3-20 letters, numbers or _<br>password: at least 8 characters</p>
        <button type="submit">Sign Up!</button>
      </form>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
